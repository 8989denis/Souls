  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  platform: linux,   types: "appimage,deb,rpm,updater" }
          - { os: windows-latest, platform: windows, types: "nsis,msi" }
          - { os: macos-latest,   platform: macos,   types: "macos,dmg" }
          - { os: ubuntu-latest,  platform: android, types: "apk,aab" }
          - { os: macos-latest,   platform: ios,     types: "ios,ipa" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.platform == 'linux' || matrix.platform == 'android'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev patchelf

      - if: matrix.platform == 'android'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - run: cargo install dioxus-cli --version 0.7.10

      - if: matrix.platform == 'android'
        run: dx bundle --package native --package-types "${{ matrix.types }}" --platform android --release
        env:
          JKS_FILE: release.jks
          JKS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - if: matrix.platform != 'android'
        run: dx bundle --package native --package-types "${{ matrix.types }}" --platform ${{ matrix.platform }} --release